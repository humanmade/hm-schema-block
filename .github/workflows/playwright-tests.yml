name: Playwright E2E Tests

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        continue-on-error: ${{ matrix.experimental == true }}
        permissions:
            contents: read
            pull-requests: write

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
                wordpress: ['6.9', '7.0', '7.1']
                include:
                    - php: '8.5'
                      wordpress: '7.1'
                    - php: '8.4'
                      wordpress: 'nightly'
                      experimental: true

        name: Test PHP ${{ matrix.php }} / WP ${{ matrix.wordpress }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer

            - name: Install PHP packages
              run: composer install --no-interaction

            - name: Build plugin
              run: npm run build

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run Playwright tests
              id: tests
              continue-on-error: true
              run: npm run test:e2e
              env:
                  CI: true
                  WP_PLAYGROUND_PHP: ${{ matrix.php }}
                  WP_PLAYGROUND_WP: ${{ matrix.wordpress }}
                  WP_PLAYGROUND_PORT: 9400

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}
                  path: test-results/
                  retention-days: 30
                  if-no-files-found: ignore

            - name: Upload Playwright report
              uses: actions/upload-artifact@v4
              if: steps.tests.outcome == 'failure'
              with:
                  name: playwright-report-php${{ matrix.php }}-wp${{ matrix.wordpress }}
                  path: playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Comment PR with test results
              uses: daun/playwright-report-summary@v3
              if: always() && github.event_name == 'pull_request'
              with:
                  report-file: test-results/results.json
                  comment-title: 'Playwright E2E Test Results (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})'

            - name: Fail if tests failed
              if: steps.tests.outcome == 'failure'
              run: exit 1
